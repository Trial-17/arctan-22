<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Premiere Copilot Loader</title>

    <style>
        body {
            background: #1e1e1e;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            overflow: hidden;
        }

        #loading-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            background: #1e1e1e;
        }

        .initial-loader {
            border: 4px solid #333;
            border-top: 4px solid #00FF9C;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Console Debug */
        #debug-console {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.9);
            color: #ff5555;
            font-family: monospace;
            font-size: 11px;
            padding: 10px;
            z-index: 20000;
            display: none;
            border-top: 1px solid red;
        }
    </style>
</head>

<body>

    <div id="loading-screen">
        <div class="initial-loader"></div>
        <p style="margin-top:10px; font-size: 12px; opacity: 0.7;">Loading Copilot...</p>
    </div>

    <div id="debug-console"></div>
    <script type="module" src="./js/main.js"></script>

</body>

</html>
