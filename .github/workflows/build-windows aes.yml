# Nom du workflow qui apparaîtra dans l'onglet "Actions" de votre repo
name: Build Windows AES

# Déclencheur : ce workflow s'exécute à chaque "push" sur la branche "main"
on:
  push:
    # branches: [ main ]
  # Permet aussi de le lancer manuellement depuis l'interface de GitHub
  workflow_dispatch:

jobs:
  build-windows-installer:
    # Utilise une machine virtuelle Windows
    runs-on: windows-latest

    steps:
      # 1. Récupère le code de votre dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure l'environnement Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Crée l'environnement virtuel et installe les dépendances
      - name: Install Python dependencies
        run: |
          python -m venv venv
          .\venv\Scripts\activate
          pip install --upgrade pip
          pip install -r backend\requirements.txt
        shell: pwsh

      # 4. Construire l'API avec PyInstaller
      - name: Build API with PyInstaller
        run: |
          .\venv\Scripts\activate
          python -m PyInstaller --noconfirm --clean --name PremiereCopilot --console --hidden-import=scipy._cyutility backend\app.py
        shell: pwsh

      # 5. Préparer les fichiers pour le ZXP
      - name: Prepare files for ZXP
        run: |
          New-Item -ItemType Directory -Force -Path "frontend\PremiereGPTaescripts\js\libs\PremiereCopilotAPI"
          Copy-Item -Path "dist\PremiereCopilot\*" -Destination "frontend\PremiereGPTaescripts\js\libs\PremiereCopilotAPI" -Recurse
        shell: pwsh

      # 6. Créer et signer le ZXP
      - name: Create and Sign ZXP
        working-directory: ./frontend
        run: |
          .\ZXPSignCmd.exe -selfSignedCert "FR" "France" "PremiereCopilot" "PremiereGPTaescripts" "plugin2025" "PremiereGPTBeta.p12" -email "admin@premierecopilot.com" -orgUnit "PremiereGPTaescripts" -validityDays 3650
          .\ZXPSignCmd.exe -sign ".\PremiereGPTaescripts" ".\PremiereGPTaescripts.zxp" ".\PremiereGPTBeta.p12" "plugin2025" -tsa http://timestamp.digicert.com/
          .\ZXPSignCmd.exe -verify ".\PremiereGPTaescripts.zxp" -certinfo
        shell: pwsh

      # 6.1. Uploader l'artefact ZXP
      - name: Upload ZXP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PremiereGPTaescripts-ZXP-Windows
          path: frontend/PremiereGPTaescripts.zxp

      # 7. Préparer les fichiers pour l'installeur Inno Setup
      - name: Prepare files for Inno Setup
        run: |
          New-Item -ItemType Directory -Force -Path "build/pkg_payload"
          Expand-Archive -Path "frontend/PremiereGPTaescripts.zxp" -DestinationPath "build/pkg_payload"
        shell: pwsh
        
      # 8. Construire l'installeur EXE avec Inno Setup
      - name: Build EXE Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          # Assurez-vous que ce chemin vers votre script Inno Setup est correct
          path: PremiereCopilotInstaller_aes.iss

      # 9. Créer le ZIP final avec l'installeur EXE et le Quickstart.pdf
      - name: Create Release ZIP
        run: |
          Compress-Archive -Path "Output/PremiereCopilot-Setup-aescripts.exe", "Quickstart.pdf" -DestinationPath "Output/PremiereCopilot-Installer-Windows-aescripts.zip"
        shell: pwsh

      # 10. Uploader l'installeur ZIP final
      - name: Upload EXE Installer ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PremiereCopilot-Installer-Windows-aescripts
          path: Output/PremiereCopilot-Installer-Windows-aescripts.zip
