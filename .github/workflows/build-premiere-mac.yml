# Installeur macOS PremiereCopilot
# Un seul pkg pour Apple Silicon et Intel (le plugin ne contient pas de code natif).
name: Build macOS Installers

on:
  # push:
  #   branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCT_VERSION: "3.0"
  STABLE_TAG: "premiere-mac-latest"
  UPDATE_LATEST: "true" # Mettre à "false" pour ne pas écraser le 'latest'

jobs:
  build-macos:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import and Verify Apple Installer Certificate
        env:
          INSTALLER_CERT_P12: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          echo "$INSTALLER_CERT_P12" | base64 --decode > installer_cert.p12
          security import installer_cert.p12 -k build.keychain -P "$INSTALLER_CERT_PASSWORD" -A -T /usr/bin/productsign -T /usr/bin/pkgbuild -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k temp build.keychain

          INSTALLER_IDENTITY=$(security find-identity -v build.keychain | grep "Developer ID Installer")
          if [ -z "$INSTALLER_IDENTITY" ]; then
            echo "::error::Developer ID Installer certificate not found."
            exit 1
          fi
          echo "✅ Installer certificate found in the keychain."

      - name: Create and Sign ZXP
        working-directory: ./frontend
        run: |
          chmod +x ./ZXPSignCmd
          ./ZXPSignCmd -selfSignedCert "FR" "France" "PremiereCopilot" "PremiereGPTBeta" "plugin2025" "PremiereGPTBeta.p12" \
            -email "admin@premierecopilot.com" -orgUnit "PremiereGPTBeta" -validityDays 3650
          ./ZXPSignCmd -sign "./PremiereGPTBeta" "./PremiereGPTBeta.zxp" "./PremiereGPTBeta.p12" "plugin2025"
          ./ZXPSignCmd -verify "./PremiereGPTBeta.zxp" -certinfo

      - name: Prepare payload
        run: |
          mkdir -p build/pkg_root/PremiereGPTBeta
          unzip -q frontend/PremiereGPTBeta.zxp -d build/pkg_root/PremiereGPTBeta

      - name: Build and Sign PKG Installer
        run: |
          VERSION="${{ env.PRODUCT_VERSION }}.${{ github.run_number }}"
          mkdir -p build/scripts
          chmod +x preinstall.sh postinstall.sh
          cp preinstall.sh build/scripts/preinstall
          cp postinstall.sh build/scripts/postinstall

          # Paquet composant (non signé, enveloppé ensuite par productbuild)
          pkgbuild --root build/pkg_root \
                   --install-location "/Library/Application Support/Adobe/CEP/extensions" \
                   --scripts build/scripts \
                   --identifier com.trial17.premierecopilot \
                   --version "$VERSION" \
                   build/component.pkg

          # Paquet final : pages d'accueil et de fin, fond, 8 langues
          sed "s/__VERSION__/$VERSION/" installer_assets/premiere/mac/distribution.xml > build/distribution.xml
          SIGNING_IDENTITY=$(security find-identity -v build.keychain | grep "Developer ID Installer" | head -n 1 | sed -e 's/.*"\(.*\)"/\1/')
          productbuild --distribution build/distribution.xml \
                       --resources installer_assets/premiere/mac \
                       --package-path build \
                       --sign "$SIGNING_IDENTITY" \
                       build/PremiereCopilot-Installer-Mac.pkg
          pkgutil --check-signature build/PremiereCopilot-Installer-Mac.pkg

      - name: Notarize and Staple PKG
        # Bloquant sur main ; sur une branche de test le pkg reste signé mais peut être non notarisé
        continue-on-error: ${{ github.ref != 'refs/heads/main' }}
        run: |
          xcrun notarytool store-credentials "notary-profile" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"
          xcrun notarytool submit build/PremiereCopilot-Installer-Mac.pkg --keychain-profile "notary-profile" --wait
          xcrun stapler staple build/PremiereCopilot-Installer-Mac.pkg

      # Anciens noms conservés : les liens ARM / Intel déjà publiés continuent de marcher
      - name: Copy PKG under legacy names
        run: |
          cp build/PremiereCopilot-Installer-Mac.pkg build/PremiereCopilot-Installer-Mac-ARM.pkg
          cp build/PremiereCopilot-Installer-Mac.pkg build/PremiereCopilot-Installer-Mac-Intel.pkg

      - name: Upload PKG Installer
        uses: actions/upload-artifact@v4
        with:
          name: PremiereCopilot-Installer-Mac
          path: build/PremiereCopilot-Installer-Mac.pkg

      - name: Update Latest Release (Lien Stable)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' && env.UPDATE_LATEST == 'true'
        with:
          tag_name: ${{ env.STABLE_TAG }}
          name: Latest Stable Version (MacOS)
          files: |
            build/PremiereCopilot-Installer-Mac.pkg
            build/PremiereCopilot-Installer-Mac-ARM.pkg
            build/PremiereCopilot-Installer-Mac-Intel.pkg
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Versioned Release (Historique)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ env.PRODUCT_VERSION }}.${{ github.run_number }}-mac
          name: Version ${{ env.PRODUCT_VERSION }}.${{ github.run_number }} (MacOS)
          files: build/PremiereCopilot-Installer-Mac.pkg
          generate_release_notes: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
