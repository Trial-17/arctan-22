# Nom du workflow
name: Build DaVinci Windows Installer

on:
  # push:
  #   branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  PRODUCT_VERSION: "2.0" # Changez ici pour passer à la v2.0, etc.
  STABLE_TAG: "davinci-win-latest"

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies 
        run: |
          python -m venv venv
          .\venv\Scripts\activate
          pip install --upgrade pip
          pip install -r backend\requirements.txt
        shell: pwsh

      # Connexion à Azure pour Artifact Signing (OIDC)
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #     subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Build API with PyInstaller
        run: |
          .\venv\Scripts\activate
          python -m PyInstaller --noconfirm --clean --name PremiereCopilot --console --hidden-import=scipy._cyutility backend\app.py
        shell: pwsh

      # Signer les binaires de l'API avec Artifact Signing
      - name: Sign API Binaries
        uses: azure/artifact-signing-action@v1
        with:
          endpoint: ${{ secrets.AZURE_TRUST_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUST_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUST_SIGNING_PROFILE }}
          files-folder: 'dist/PremiereCopilot'
          files-folder-filter: 'exe,dll,pyd'
          files-folder-recurse: true
          file-digest: 'SHA256'
          timestamp-rfc3161: 'http://timestamp.acs.microsoft.com'
          timestamp-digest: 'SHA256'

      - name: Prepare files for Inno Setup
        run: |
          New-Item -ItemType Directory -Force -Path "frontend\DavinciGPT\js\libs\PremiereCopilotAPI"
          Copy-Item -Path "dist\PremiereCopilot\*" -Destination "frontend\DavinciGPT\js\libs\PremiereCopilotAPI" -Recurse

          New-Item -ItemType Directory -Force -Path "build\pkg_payload"
          Copy-Item -Path "frontend\DavinciGPT\*" -Destination "build\pkg_payload" -Recurse
        shell: pwsh
        
      - name: Build EXE Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: DavinciCopilotInstaller.iss

      # Signer l'installeur final .EXE avec Artifact Signing
      - name: Sign EXE Installer
        uses: azure/artifact-signing-action@v1
        with:
          endpoint: ${{ secrets.AZURE_TRUST_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUST_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUST_SIGNING_PROFILE }}
          files-folder: 'Output'
          files-folder-filter: 'exe'
          file-digest: 'SHA256'
          timestamp-rfc3161: 'http://timestamp.acs.microsoft.com'
          timestamp-digest: 'SHA256'

      - name: Upload EXE Installer
        uses: actions/upload-artifact@v4
        with:
          name: DavinciCopilot-Installer-Windows
          path: Output/DavinciCopilot-Setup.exe

      - name: Update Latest Release (Lien Stable)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ env.STABLE_TAG }}
          name: Latest Stable Version (Windows)
          files: Output/DavinciCopilot-Setup.exe
          make_latest: false # On évite de polluer le tag "Latest" global de GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Versioned Release (Historique)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ env.PRODUCT_VERSION }}.${{ github.run_number }}-win
          name: Version ${{ env.PRODUCT_VERSION }}.${{ github.run_number }} (Windows)
          files: Output/DavinciCopilot-Setup.exe
          generate_release_notes: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
