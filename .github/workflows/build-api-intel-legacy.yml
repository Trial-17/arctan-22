# Nom du workflow qui apparaîtra dans l'onglet "Actions" de votre repo
name: Build macOS Installer (Legacy Intel)

# Déclencheur : ce workflow s'exécute à chaque "push" sur la branche "main"
on:
  # push:
  #   branches: [ main ]
  # Permet aussi de le lancer manuellement depuis l'interface de GitHub
  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCT_VERSION: "2.0" # Changez ici pour passer à la v2.0, etc.
  STABLE_TAG: "api-legacy-mac-latest"

jobs:
  build-macos-intel:
    # Stratégie de Matrice : exécute uniquement pour Mac Intel sur la plus ancienne version disponible
    strategy:
      matrix:
        include:
          - os: macos-14
            platform: Mac-Intel
            architecture: x64

    # Utilise la machine virtuelle définie dans la matrice
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      # 1. Récupère le code de votre dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Importer et vérifier les certificats Apple (Fail Fast)
      - name: Import and Verify Apple Certificates
        env:
          APP_CERT_P12: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12 }}
          APP_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          INSTALLER_CERT_P12: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          # Importation des certificats séparés
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          echo "$APP_CERT_P12" | base64 --decode > app_cert.p12
          security import app_cert.p12 -k build.keychain -P "$APP_CERT_PASSWORD" -A -T /usr/bin/codesign
          echo "$INSTALLER_CERT_P12" | base64 --decode > installer_cert.p12
          security import installer_cert.p12 -k build.keychain -P "$INSTALLER_CERT_PASSWORD" -A -T /usr/bin/productsign -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k temp build.keychain

          # Vérification que les deux identités sont bien présentes
          echo "--- Available Identities ---"
          security find-identity -v build.keychain
          echo "------------------------------------"
          
          APP_IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          if [ -z "$APP_IDENTITY" ]; then
            echo "::error::Developer ID Application certificate not found."
            exit 1
          fi
          
          # Correction : On cherche dans toutes les identités
          INSTALLER_IDENTITY=$(security find-identity -v build.keychain | grep "Developer ID Installer")
          if [ -z "$INSTALLER_IDENTITY" ]; then
            echo "::error::Developer ID Installer certificate not found."
            exit 1
          fi
          
          echo "✅ Both Application and Installer certificates found in the keychain."

      # 3. Configure l'environnement Python Intel (via Rosetta 2 pour les runners ARM de 2026)
      - name: Install Intel Python 3.12
        run: |
          # Téléchargement du pkg officiel (Universal/Intel) compatible macOS 11+
          curl -L -O https://www.python.org/ftp/python/3.12.3/python-3.12.3-macos11.pkg
          sudo installer -pkg python-3.12.3-macos11.pkg -target /
          
          # Vérification que c'est bien la version x86_64 qui répondra à 'arch -x86_64'
          arch -x86_64 /usr/local/bin/python3 --version
          arch -x86_64 /usr/local/bin/python3 -c "import platform; print(platform.machine())"




      # 4. Crée l'environnement virtuel Intel et installe les dépendances
      - name: Install Python dependencies
        run: |
          # 1. Variables de rétrocompatibilité STRICTES
          export MACOSX_DEPLOYMENT_TARGET=11.0
          export SYSTEM_VERSION_COMPAT=1
          
          arch -x86_64 /usr/local/bin/python3 -m venv venv
          source venv/bin/activate
          
          # 2. Mise à jour des outils de build
          arch -x86_64 python -m pip install --upgrade pip setuptools wheel
          
          echo "=== 1. CE QUE PYTHON ET PIP VOIENT MAINTENANT ==="
          arch -x86_64 python -c "
          import platform, sys, os
          from packaging import tags
          print(f'Architecture   : {platform.machine()}')
          print(f'macOS perçu    : {platform.mac_ver()[0]}')
          print(f'Déploiement    : {os.environ.get(\"MACOSX_DEPLOYMENT_TARGET\")}')
          print('\nTop 5 Wheels acceptés :')
          print('\n'.join([str(t) for t in tags.sys_tags()][:5]))
          "

          # 3. Installation naturelle (sans forcer only-binary pour laisser passer srt)
          arch -x86_64 python -m pip install -r backend/requirements_old_version.txt

          # 4. Dépendances de PyInstaller
          arch -x86_64 python -m pip install macholib altgraph pyinstaller-hooks-contrib
        shell: bash
        # 5. Construire l'API avec PyInstaller
      - name: Build API with PyInstaller
        run: |
          source venv/bin/activate
          # Force l'exécution en x86_64 pour que PyInstaller génère un binaire Intel
          arch -x86_64 python -m PyInstaller --noconfirm --clean --name PremiereCopilot --console --hidden-import=scipy._cyutility backend/app.py
        shell: bash

      # 6. Signer correctement tout le bundle PyInstaller (Méthode Manuelle Stricte)
      - name: Sign PyInstaller Bundle (Correct Method)
        run: |
          # DÉVERROUILLAGE VITAL DU KEYCHAIN POUR ÉVITER LE FREEZE
          security unlock-keychain -p temp build.keychain

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -n 1 | sed -e 's/.*"\(.*\)"/\1/')
          echo "Using Identity: $SIGNING_IDENTITY"

          # 1. Nettoyer les fichiers gênants (souvent créés par PyInstaller)
          find dist/PremiereCopilot -name "*.DS_Store" -delete

          # 2. Signer les frameworks et dylibs internes (Inside-Out)
          # On signe tout ce qui est .so, .dylib, ou binaire dans _internal
          echo "--- Signing internal libs ---"
          find dist/PremiereCopilot/_internal -type f \( -name "*.so" -o -name "*.dylib" -o -perm +111 \) -exec codesign --force --sign "$SIGNING_IDENTITY" --options runtime --timestamp {} \;

          # 3. Signer l'exécutable principal (Le fichier binaire, pas le dossier)
          echo "--- Signing main executable ---"
          # Attention : PyInstaller crée un dossier "PremiereCopilot" ET un binaire "PremiereCopilot" dedans
          codesign --force --sign "$SIGNING_IDENTITY" --options runtime --timestamp --entitlements entitlements.plist "dist/PremiereCopilot/PremiereCopilot"

          # 4. Vérification
          echo "--- Verifying ---"
          codesign --verify --verbose "dist/PremiereCopilot/PremiereCopilot"


          
      # 7. Vérification Statique (macOS Deployment Target)
      - name: Static Verification - Check Minimum OS Version
        run: |
          echo "--- Checking load commands for LC_BUILD_VERSION or LC_VERSION_MIN_MACOSX ---"
          otool -l dist/PremiereCopilot/PremiereCopilot | grep -A 3 "LC_BUILD_VERSION\|LC_VERSION_MIN_MACOSX"
          
          # Vérification que le minos est bien 11.0 (ou inférieur)
          MIN_OS=$(otool -l dist/PremiereCopilot/PremiereCopilot | grep -A 3 "LC_BUILD_VERSION" | grep "minos" | awk '{print $2}')
          echo "Detected Min OS: $MIN_OS"
          if [[ "$MIN_OS" != "11.0" && "$MIN_OS" != "10.13" ]]; then
             echo "::warning::Min OS version detected ($MIN_OS) is different from target (11.0)."
          fi

      # 8. Smoke Test - Lancer l'API et vérifier qu'elle répond
      - name: Run Smoke Test
        run: |
          source venv/bin/activate
          # On s'assure que 'requests' est bien là
          pip install requests
          # On peut lancer le test Intel sur l'ARM de GitHub grâce à Rosetta 2
          arch -x86_64 python tests/smoke_test.py
        shell: bash

      # 9. Préparer les fichiers pour le ZXP
      # - name: Prepare files for ZXP
      #   run: |
      #     mkdir -p frontend/PremiereGPTBeta/js/libs/PremiereCopilotAPI
      #     # Ajoute "/." à la source pour copier le contenu du dossier, et non le dossier lui-même
      #     cp -R dist/PremiereCopilot/. frontend/PremiereGPTBeta/js/libs/PremiereCopilotAPI/
      - name: Prepare files for ZXP
        run: |
          mkdir -p frontend/PremiereGPTBeta/js/libs/PremiereCopilotAPI
          
          # LE SECRET EST ICI : L'option -L force la copie du VRAI fichier au lieu du lien symbolique
          cp -R -L dist/PremiereCopilot/. frontend/PremiereGPTBeta/js/libs/PremiereCopilotAPI/

      # 10. Créer et signer le ZXP (robuste, avec certificat auto-signé)
      - name: Create and Sign ZXP
        working-directory: ./frontend
        run: |
          echo "--- Making ZXPSignCmd executable ---"
          chmod +x ./ZXPSignCmd

          echo "--- Generating self-signed certificate for ZXP ---"
          ./ZXPSignCmd -selfSignedCert "FR" "France" "PremiereCopilot" "PremiereGPTBeta" "plugin2025" "PremiereGPTBeta.p12" \
            -email "admin@premierecopilot.com" \
            -orgUnit "PremiereGPTBeta" \
            -validityDays 3650

          if [ ! -f "PremiereGPTBeta.p12" ]; then
            echo "::error::Failed to generate self-signed certificate."
            exit 1
          fi

          echo "--- Signing the extension folder into ZXP ---"
          ./ZXPSignCmd -sign "./PremiereGPTBeta" "./PremiereGPTBeta.zxp" "./PremiereGPTBeta.p12" "plugin2025"

          if [ ! -f "PremiereGPTBeta.zxp" ]; then
            echo "::error::Failed to create ZXP."
            exit 1
          fi

          echo "--- Verifying ZXP signature ---"
          ./ZXPSignCmd -verify "./PremiereGPTBeta.zxp" -certinfo


      # 11. Construire et signer l'installeur PKG
      # - name: Build and Sign PKG Installer
      #   run: |
      #     mkdir -p build/pkg_root/PremiereGPTBeta
      #     unzip frontend/PremiereGPTBeta.zxp -d build/pkg_root/PremiereGPTBeta
      #     mkdir -p build/scripts
      #     chmod +x preinstall.sh postinstall.sh
      #     cp preinstall.sh build/scripts/preinstall
      #     cp postinstall.sh build/scripts/postinstall
          
      #     echo "--- Available identities in build.keychain ---"
      #     security find-identity -v build.keychain
      #     echo "---------------------------------------------"

      #     # Correction : On cherche dans toutes les identités (-v)
      #     SIGNING_IDENTITY=$(security find-identity -v build.keychain | grep "Developer ID Installer" | head -n 1 | sed -e 's/.*"\(.*\)"/\1/')
          
      #     if [ -z "$SIGNING_IDENTITY" ]; then
      #       echo "::error::Developer ID Installer identity not found."
      #       exit 1
      #     fi

      #     echo "Using Installer signing identity: $SIGNING_IDENTITY"
      #     pkgbuild --root build/pkg_root \
      #              --install-location "/Library/Application Support/Adobe/CEP/extensions" \
      #              --scripts build/scripts \
      #              --identifier com.trial17.premierecopilot \
      #              --version 1.0 \
      #              --sign "$SIGNING_IDENTITY" \
      #              build/PremiereCopilot-Installer.pkg
      


      # 11. Construire et signer l'installeur PKG
      - name: Build and Sign PKG Installer
        run: |
          mkdir -p build/pkg_root/PremiereGPTBeta
          unzip frontend/PremiereGPTBeta.zxp -d build/pkg_root/PremiereGPTBeta
          
          echo "--- AUTOMATED TEST: Verifying Extracted Python Engine ---"
          PYTHON_PATH="build/pkg_root/PremiereGPTBeta/js/libs/PremiereCopilotAPI/_internal/Python"
          
          # 1. Vérifie si le fichier existe (les liens cassés retournent faux ici)
          if [ ! -f "$PYTHON_PATH" ]; then
            echo "::error::Le fichier Python a disparu ou le lien est cassé après l'unzip !"
            exit 1
          fi
          
          # 2. Vérifie la taille du fichier (doit faire plusieurs Mo, pas juste 50 octets)
          FILE_SIZE=$(stat -f%z "$PYTHON_PATH")
          echo "Taille du moteur Python extrait : $FILE_SIZE octets"
          
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "::error::Le fichier Python est trop petit ($FILE_SIZE octets). C'est un lien symbolique cassé !"
            exit 1
          fi
          echo "✅ Test réussi : Le moteur Python est un vrai fichier physique intact !"
          echo "---------------------------------------------------------"

          mkdir -p build/scripts
          chmod +x preinstall.sh postinstall.sh
          cp preinstall.sh build/scripts/preinstall
          cp postinstall.sh build/scripts/postinstall
          
          echo "--- Available identities in build.keychain ---"
          security find-identity -v build.keychain
          echo "---------------------------------------------"

          # Correction : On cherche dans toutes les identités (-v)
          SIGNING_IDENTITY=$(security find-identity -v build.keychain | grep "Developer ID Installer" | head -n 1 | sed -e 's/.*"\(.*\)"/\1/')
          
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "::error::Developer ID Installer identity not found."
            exit 1
          fi

          echo "Using Installer signing identity: $SIGNING_IDENTITY"
          pkgbuild --root build/pkg_root \
                   --install-location "/Library/Application Support/Adobe/CEP/extensions" \
                   --scripts build/scripts \
                   --identifier com.trial17.premierecopilot \
                   --version 1.0 \
                   --sign "$SIGNING_IDENTITY" \
                   build/PremiereCopilot-Installer.pkg    
                   
                   
      # 12. Notariser et agrafer l'installeur PKG (Native notarytool)
      - name: Notarize and Staple PKG
        run: |
          # Création du profil temporaire pour notarytool
          xcrun notarytool store-credentials "notary-profile" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"

          echo "--- Submitting to Apple Notary Service ---"
          # On empêche le script de crasher immédiatement en cas de refus d'Apple
          set +e
          xcrun notarytool submit build/PremiereCopilot-Installer.pkg \
            --keychain-profile "notary-profile" \
            --wait > notary_output.txt 2>&1
          NOTARY_EXIT_CODE=$?
          set -e
          
          # On affiche ce qui s'est passé
          cat notary_output.txt
          
          # Si le code de sortie n'est pas 0 (Invalid), on va chercher le log exact
          if [ $NOTARY_EXIT_CODE -ne 0 ]; then
            echo "::error::La notarisation a été rejetée par Apple. Récupération du rapport détaillé..."
            # On extrait l'ID de soumission avec une regex
            SUBMISSION_ID=$(grep -oEo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' notary_output.txt | head -n 1)
            
            echo "--- RAPPORT D'ERREUR APPLE NOTARY SERVICE ---"
            xcrun notarytool log "$SUBMISSION_ID" --keychain-profile "notary-profile"
            echo "---------------------------------------------"
            exit 1
          fi

          echo "--- Stapling Ticket ---"
          xcrun stapler staple build/PremiereCopilot-Installer.pkg
      # 13. Uploader l'artefact final
      - name: Upload PKG Installer
        uses: actions/upload-artifact@v4
        with:
          name: PremiereCopilot-Installer-Legacy-${{ matrix.platform }}
          path: build/PremiereCopilot-Installer.pkg

      - name: Rename PKG for Release
        run: mv build/PremiereCopilot-Installer.pkg build/PremiereCopilot-Installer-Legacy-${{ matrix.platform }}.pkg

      - name: Update Latest Release (Lien Stable)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ env.STABLE_TAG }}
          name: Latest Stable Version (Legacy Intel Mac)
          files: build/PremiereCopilot-Installer-Legacy-${{ matrix.platform }}.pkg
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Versioned Release (Historique)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ env.PRODUCT_VERSION }}.${{ github.run_number }}-legacy-${{ matrix.platform }}
          name: Version ${{ env.PRODUCT_VERSION }}.${{ github.run_number }} (Legacy Intel Mac)
          files: build/PremiereCopilot-Installer-Legacy-${{ matrix.platform }}.pkg
          generate_release_notes: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
