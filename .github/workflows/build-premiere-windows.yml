# Nom du workflow qui apparaîtra dans l'onglet "Actions" de votre repo
name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  PRODUCT_VERSION: "3.0" # Changez ici pour passer à la v2.0, etc.
  STABLE_TAG: "premiere-win-latest"
  UPDATE_LATEST: "true" # Mettre à "false" pour ne pas écraser le 'latest'

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Connexion à Azure pour Artifact Signing (OIDC)
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #     subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      # Créer et signer le ZXP
      - name: Create and Sign ZXP
        working-directory: ./frontend
        run: |
          .\ZXPSignCmd.exe -selfSignedCert "FR" "France" "PremiereCopilot" "PremiereGPTBeta" "plugin2025" "PremiereGPTBeta.p12" -email "admin@premierecopilot.com" -orgUnit "PremiereGPTBeta" -validityDays 3650
          .\ZXPSignCmd.exe -sign ".\PremiereGPTBeta" ".\PremiereGPTBeta.zxp" ".\PremiereGPTBeta.p12" "plugin2025" -tsa http://timestamp.digicert.com/
          .\ZXPSignCmd.exe -verify ".\PremiereGPTBeta.zxp" -certinfo
        shell: pwsh

      # Uploader l'artefact ZXP
      - name: Upload ZXP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PremiereGPTBeta-ZXP-Windows
          path: frontend/PremiereGPTBeta.zxp

      # Préparer les fichiers pour l'installeur Inno Setup
      - name: Prepare files for Inno Setup
        run: |
          New-Item -ItemType Directory -Force -Path "build/pkg_payload"
          Expand-Archive -Path "frontend/PremiereGPTBeta.zxp" -DestinationPath "build/pkg_payload"
        shell: pwsh

      # Construire l'installeur EXE avec Inno Setup
      - name: Build EXE Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: PremiereCopilotInstaller.iss

      # Signer l'installeur final .EXE avec Artifact Signing
      - name: Sign EXE Installer
        uses: azure/artifact-signing-action@v1
        with:
          endpoint: ${{ secrets.AZURE_TRUST_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUST_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUST_SIGNING_PROFILE }}
          files-folder: 'Output'
          files-folder-filter: 'exe'
          file-digest: 'SHA256'
          timestamp-rfc3161: 'http://timestamp.acs.microsoft.com'
          timestamp-digest: 'SHA256'

      - name: Upload EXE Installer
        uses: actions/upload-artifact@v4
        with:
          name: PremiereCopilot-Installer-Windows
          path: Output/PremiereCopilot-Setup.exe

      - name: Update Latest Release (Lien Stable)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' && env.UPDATE_LATEST == 'true'
        with:
          tag_name: ${{ env.STABLE_TAG }}
          name: Latest Stable Version (Windows)
          files: Output/PremiereCopilot-Setup.exe
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Versioned Release (Historique)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ env.PRODUCT_VERSION }}.${{ github.run_number }}-win
          name: Version ${{ env.PRODUCT_VERSION }}.${{ github.run_number }} (Windows)
          files: Output/PremiereCopilot-Setup.exe
          generate_release_notes: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
