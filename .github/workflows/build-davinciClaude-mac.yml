# Nom du workflow
name: Build davinciClaude macOS Installers

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCT_VERSION: "2.0" # Changez ici pour passer à la v2.0, etc.
  STABLE_TAG: "davinciclaude-mac-latest"

jobs:
  build-macos:
    strategy:
      matrix:
        include:
          - os: macos-15
            platform: Mac-ARM
          - os: macos-15
            platform: Mac-Intel

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import and Verify Apple Installer Certificate
        env:
          INSTALLER_CERT_P12: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          echo "$INSTALLER_CERT_P12" | base64 --decode > installer_cert.p12
          security import installer_cert.p12 -k build.keychain -P "$INSTALLER_CERT_PASSWORD" -A -T /usr/bin/productsign -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k temp build.keychain

          echo "--- Available Identities ---"
          security find-identity -v build.keychain

          INSTALLER_IDENTITY=$(security find-identity -v build.keychain | grep "Developer ID Installer")
          if [ -z "$INSTALLER_IDENTITY" ]; then
            echo "::error::Developer ID Installer certificate not found."
            exit 1
          fi

          echo "✅ Installer certificate found in the keychain."

      - name: Build and Sign PKG Installer
        run: |
          mkdir -p build/pkg_root/davinciClaude
          cp -R frontend/davinciClaude/. build/pkg_root/davinciClaude/

          mkdir -p build/scripts
          chmod +x preinstall_davinciClaude.sh postinstall_davinciClaude.sh
          cp preinstall_davinciClaude.sh build/scripts/preinstall
          cp postinstall_davinciClaude.sh build/scripts/postinstall

          SIGNING_IDENTITY=$(security find-identity -v build.keychain | grep "Developer ID Installer" | head -n 1 | sed -e 's/.*"\(.*\)"/\1/')

          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "::error::Developer ID Installer identity not found."
            exit 1
          fi

          echo "Using Installer signing identity: $SIGNING_IDENTITY"
          pkgbuild --root build/pkg_root \
                   --install-location "/Library/Application Support/Blackmagic Design/DaVinci Resolve/Workflow Integration Plugins" \
                   --scripts build/scripts \
                   --identifier com.trial17.davinciclaude \
                   --version 1.0 \
                   --sign "$SIGNING_IDENTITY" \
                   build/davinciClaude-Installer.pkg

      - name: Notarize and Staple PKG
        run: |
          xcrun notarytool store-credentials "notary-profile" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"

          echo "--- Submitting to Apple Notary Service ---"
          xcrun notarytool submit build/davinciClaude-Installer.pkg \
            --keychain-profile "notary-profile" \
            --wait

          echo "--- Stapling Ticket ---"
          xcrun stapler staple build/davinciClaude-Installer.pkg

      - name: Upload PKG Installer
        uses: actions/upload-artifact@v4
        with:
          name: davinciClaude-Installer-${{ matrix.platform }}
          path: build/davinciClaude-Installer.pkg

      - name: Rename PKG for Release
        run: mv build/davinciClaude-Installer.pkg build/davinciClaude-Installer-${{ matrix.platform }}.pkg

      - name: Update Latest Release (Lien Stable)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ env.STABLE_TAG }}
          name: davinciClaude — Latest Stable (macOS)
          files: build/davinciClaude-Installer-${{ matrix.platform }}.pkg
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Versioned Release (Historique)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: davinciclaude-v${{ env.PRODUCT_VERSION }}.${{ github.run_number }}-mac-${{ matrix.platform }}
          name: davinciClaude v${{ env.PRODUCT_VERSION }}.${{ github.run_number }} (macOS - ${{ matrix.platform }})
          files: build/davinciClaude-Installer-${{ matrix.platform }}.pkg
          generate_release_notes: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
